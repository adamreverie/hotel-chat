<!DOCTYPE html>
<html>
<head>
    <title>favvi — Hotel Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background orb */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(201,168,76,0.15);
            border-radius: 4px;
            padding: 52px 44px;
            width: 380px;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 300;
            color: #f8f4ee;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }
        .logo span { color: #c9a84c; }

        .tagline {
            font-size: 12px;
            font-weight: 300;
            color: rgba(248,244,238,0.35);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 44px;
        }

        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(248,244,238,0.4);
            margin-bottom: 8px;
        }
        .field input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 300;
            color: #f8f4ee;
            outline: none;
            transition: border-color 0.3s;
        }
        .field input::placeholder { color: rgba(248,244,238,0.2); }
        .field input:focus { border-color: rgba(201,168,76,0.5); }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #c9a84c;
            color: #1a1a2e;
            border: none;
            border-radius: 2px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.3s, transform 0.15s;
        }
        .login-btn:hover {
            background: #e8c97a;
            transform: translateY(-1px);
        }

        .error {
            color: #e57373;
            font-size: 12px;
            margin-top: 12px;
            display: none;
            text-align: center;
        }

        .divider {
            height: 1px;
            background: rgba(201,168,76,0.1);
            margin: 36px 0 0;
        }
        .footer-text {
            font-size: 11px;
            color: rgba(248,244,238,0.2);
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">fav<span>vi</span></div>
        <p class="tagline">Hotel Management Portal</p>

        <div class="field">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="manager@yourhotel.com"
                onkeypress="if(event.key==='Enter') login()"
            />
        </div>
        <div class="field">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                onkeypress="if(event.key==='Enter') login()"
            />
        </div>

        <button class="login-btn" onclick="login()">Login to Portal</button>
        <p class="error" id="error">Incorrect email or password.</p>

        <div class="divider"></div>
        <p class="footer-text">favvi — AI guest experience platform</p>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                document.getElementById('error').textContent = 'Please fill in all fields.';
                document.getElementById('error').style.display = 'block';
                return;
            }

            const response = await fetch('/hotel-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
                window.location.href = `/portal/${data.slug}`;
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
