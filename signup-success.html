<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico">
    <title>You're Live — Favvi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1a1a2e;
            --gold: #c9a84c;
            --gold-dark: #8a6e2a;
            --linen: #f0efe9;
            --white: #ffffff;
            --cream: #f8f4ee;
            --ink: #1a1a2e;
            --ink-60: rgba(26,26,46,0.6);
            --ink-40: rgba(26,26,46,0.4);
            --line: rgba(26,26,46,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--linen);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--line);
            border-top: 3px solid var(--gold);
            border-radius: 4px;
            padding: 52px 44px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 16px 48px rgba(26,26,46,0.08);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }
        .logo span { color: var(--gold); }

        .mark {
            font-family: 'Cormorant Garamond', serif;
            font-size: 58px;
            font-weight: 300;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 22px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            font-weight: 600;
            margin-bottom: 14px;
        }
        h1 em { font-style: italic; color: var(--gold-dark); font-weight: 400; }

        .trial-badge {
            display: inline-block;
            border: 1px solid rgba(201,168,76,0.4);
            color: var(--gold-dark);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 2px;
            margin-bottom: 26px;
        }

        p {
            font-size: 14px;
            font-weight: 300;
            color: var(--ink-60);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .portal-btn {
            display: block;
            background: var(--navy);
            color: var(--cream);
            padding: 15px 36px;
            border-radius: 2px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.25s;
            margin-bottom: 18px;
        }
        .portal-btn:hover { background: var(--gold); color: var(--navy); }

        .help-link {
            font-size: 12px;
            font-weight: 300;
            color: var(--ink-40);
        }
        .help-link a { color: var(--gold-dark); text-decoration: none; }
        .help-link a:hover { text-decoration: underline; }

        @media (max-width: 460px) {
            .card { padding: 40px 24px; }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">fav<span>vi</span></div>
        <div class="mark">✦</div>
        <h1>You're <em>live.</em></h1>
        <div class="trial-badge">14-Day Free Trial Started</div>
        <p>Your hotel portal is ready. We've sent your login details to your email — check your inbox to get started.</p>
        <a class="portal-btn" id="portalBtn" href="/login">Go to My Portal</a>
        <div class="help-link">
            Need help? <a href="mailto:hello@favvi.ai">hello@favvi.ai</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');
        if (slug) {
            document.getElementById('portalBtn').href = `/portal/${slug}`;
        }
    </script>
</body>
</html>
