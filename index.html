<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <title>Hotel Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #f0efe9; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .chat-container { width: 390px; height: 700px; background: white; border-radius: 3px; box-shadow: 0 10px 40px rgba(26,26,46,0.12); display: flex; flex-direction: column; overflow: hidden; }

        .header { background: #1a1a2e; padding: 24px 22px 20px; }

        /* Hotel name — dominant, guests know where they are instantly */
        .hotel-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: #c9a84c; letter-spacing: 1px; margin-bottom: 2px; }
        .hotel-sub { font-size: 11px; font-weight: 300; color: rgba(248,244,238,0.4); letter-spacing: 0.5px; margin-bottom: 10px; }

        .online-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(76,175,80,0.12); border: 1px solid rgba(76,175,80,0.2); padding: 4px 10px; border-radius: 2px; font-size: 10px; font-weight: 400; color: rgba(76,175,80,0.9); letter-spacing: 0.5px; text-transform: uppercase; }
        .online-dot { width: 6px; height: 6px; background: #4CAF50; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #fafaf8; }

        .message { max-width: 82%; padding: 11px 15px; font-size: 14px; font-weight: 300; line-height: 1.55; }
        .agent { background: white; color: #1a1a2e; align-self: flex-start; border-radius: 2px 14px 14px 14px; box-shadow: 0 1px 4px rgba(26,26,46,0.07); }
        .user  { background: #1a1a2e; color: #f8f4ee; align-self: flex-end; border-radius: 14px 2px 14px 14px; font-weight: 400; }

        .agent h1, .agent h2, .agent h3 { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; margin: 6px 0 3px; }
        .agent p { margin: 3px 0; }
        .agent ul, .agent ol { margin: 4px 0; padding-left: 16px; }
        .agent li { margin: 2px 0; }
        .agent strong { font-weight: 500; }

        .typing-indicator { font-size: 11px; font-weight: 300; color: rgba(26,26,46,0.35); padding: 0 20px 8px; height: 24px; letter-spacing: 0.3px; background: #fafaf8; }

        .quick-replies { display: flex; flex-wrap: wrap; gap: 7px; padding: 10px 16px; background: white; border-top: 1px solid #f0efe9; }
        .quick-reply { background: #f0efe9; border: none; color: rgba(26,26,46,0.65); padding: 6px 12px; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 400; cursor: pointer; transition: all 0.2s; }
        .quick-reply:hover { background: #1a1a2e; color: white; }

        .input-area { padding: 12px 14px; display: flex; gap: 10px; border-top: 1px solid #f0efe9; background: white; }
        input { flex: 1; padding: 11px 16px; border: 1.5px solid #e8e8e8; border-radius: 2px; outline: none; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 300; color: #1a1a2e; background: #fafafa; transition: border-color 0.2s; }
        input::placeholder { color: rgba(26,26,46,0.25); }
        input:focus { border-color: #1a1a2e; background: white; }
        .send-btn { background: #1a1a2e; color: white; border: none; width: 44px; height: 44px; border-radius: 2px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.2s; }
        .send-btn:hover { opacity: 0.85; }

        @media (max-width: 768px) {
            body { align-items: flex-start; background: white; }
            .chat-container { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
            input { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <div class="hotel-title hotel-name">Loading...</div>
            <div class="hotel-sub">Your Personal Room Assistant</div>
            <div class="online-pill"><div class="online-dot"></div>Available 24/7</div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="typing-indicator" id="typing"></div>
        <div class="quick-replies">
            <button class="quick-reply" onclick="sendQuick('WiFi password please')">WiFi</button>
            <button class="quick-reply" onclick="sendQuick('What time is breakfast?')">Breakfast</button>
            <button class="quick-reply" onclick="sendQuick('I\'d like to order room service')">Room Service</button>
            <button class="quick-reply" onclick="sendQuick('What are the pool hours?')">Pool</button>
            <button class="quick-reply" onclick="sendQuick('Can you make up my room please?')">Housekeeping</button>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="How can we help you?" onkeypress="handleKey(event)" />
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const slug = window.location.pathname.split('/')[2] || '';
        async function loadConfig() {
            const url = slug ? `/get-hotel/${slug}` : '/hotel-config';
            const r = await fetch(url); const config = await r.json();
            document.querySelectorAll('.hotel-name').forEach(el => el.textContent = config.name);
            document.title = config.name + ' — Room Assistant';
            return config;
        }
        window.onload = async function() {
            const config = await loadConfig();
            addMessage(`Welcome to ${config.name}! 🌟 I'm your personal room assistant. How can I help you today?`, 'agent');
        }
        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
        function sendQuick(text) { document.getElementById('userInput').value = text; sendMessage(); }
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim(); if (!message) return;
            addMessage(message, 'user'); input.value = '';
            document.getElementById('typing').textContent = 'Assistant is typing...';
            try {
                const r = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, slug }) });
                const data = await r.json();
                document.getElementById('typing').textContent = '';
                addMessage(data.response, 'agent');
            } catch(e) { document.getElementById('typing').textContent = ''; addMessage('Sorry, something went wrong. Please try again.', 'agent'); }
        }
        function addMessage(text, sender) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div'); div.className = `message ${sender}`;
            if (sender === 'agent') div.innerHTML = marked.parse(text); else div.textContent = text;
            messages.appendChild(div); messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
