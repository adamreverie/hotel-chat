<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <title>Hotel Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 390px;
            height: 700px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: #1a1a2e;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        .header h2 { 
            font-size: 20px;
            margin-bottom: 4px;
        }
        .header p { 
            font-size: 12px; 
            opacity: 0.7; 
        }
        .online {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 12px;
            opacity: 0.9;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
             padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            hite-space: pre-wrap;
        }
        .agent {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            border-radius: 4px 18px 18px 18px;
        }
        .user {
            background: #1a1a2e;
            color: white;
            align-self: flex-end;
            border-radius: 18px 4px 18px 18px;
        }
        .typing-indicator {
            font-size: 12px;
            color: #999;
            padding: 0 20px 10px;
            height: 24px;
        }
        .input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #eee;
            background: white;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            background: #f9f9f9;
        }
        input:focus {
            border-color: #1a1a2e;
            background: white;
        }
        button {
            background: #1a1a2e;
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover { opacity: 0.85; }
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 15px;
        }
        .quick-reply {
            background: white;
            border: 1px solid #1a1a2e;
            color: #1a1a2e;
            padding: 4px 12px;
            border-radius: 18px;
            font-size: 10px;
            cursor: pointer;
        }
        .quick-reply:hover {
            background: #1a1a2e;
            color: white;
        }
        .agent h1, .agent h2, .agent h3 {
    font-size: 14px;
    font-weight: bold;
    margin: 8px 0 4px 0;
}

.agent p {
    margin: 4px 0;
}

.agent ul, .agent ol {
    margin: 4px 0;
    padding-left: 16px;
}

.agent li {
    margin: 2px 0;
}

.agent strong {
    font-weight: bold;
}

.agent hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 8px 0;
}

.agent a {
    color: #1a1a2e;
    text-decoration: underline;
}
 @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding: 0;
            }
            .chat-container {
                width: 100%;
                height: 100vh;
                height: 100dvh;
                border-radius: 0;
            }
            .messages {
                flex: 1;
                overflow-y: auto;
            }
            input {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h2>🏨 <span class="hotel-name">Loading...</span></h2>
            <p>Your Personal Room Assistant</p>
            <div class="online">
                <div class="dot"></div>
                Available 24/7
            </div>
        </div>

        <div class="messages" id="messages"></div>
        <div class="typing-indicator" id="typing"></div>

        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply" onclick="sendQuick('📶 WiFi Password')">📶 WiFi</button>
            <button class="quick-reply" onclick="sendQuick('🍳 Breakfast times')">🍳 Breakfast</button>
            <button class="quick-reply" onclick="sendQuick('🛎️ Room service')">🛎️ Room Service</button>
            <button class="quick-reply" onclick="sendQuick('🏊 Pool hours')">🏊 Pool</button>
            <button class="quick-reply" onclick="sendQuick('🧹 Make up my room, please')">🧹 Cleanliness</button>
        </div>

        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="How can we help you?"
                onkeypress="handleKey(event)"
            />
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        async function loadConfig() {
    const response = await fetch('/hotel-config');
    const config = await response.json();
    document.querySelectorAll('.hotel-name').forEach(el => {
        el.textContent = config.name;
    });
    return config;
        }

        window.onload = async function() {
        const config = await loadConfig();
        addMessage(`Welcome to ${config.name}! 🌟 I'm your personal room assistant. How can I help you today?`, 'agent');
}

        function handleKey(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function sendQuick(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            document.getElementById('typing').textContent = '✦ Assistant is typing...';

            try {
                const slug = window.location.pathname.split('/')[2] || '';

                const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, slug })
        });

                const data = await response.json();
                document.getElementById('typing').textContent = '';
                addMessage(data.response, 'agent');
            } catch (error) {
                document.getElementById('typing').textContent = '';
                addMessage('Sorry, something went wrong. Please try again.', 'agent');
            }
        }

        function addMessage(text, sender) {
        const messages = document.getElementById('messages');
        const div = document.createElement('div');
            div.className = `message ${sender}`;
            if (sender === 'agent') {
             div.innerHTML = marked.parse(text);
            } else {
            div.textContent = text;
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}
    </script>
</body>
</html>
