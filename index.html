<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <title>Hotel Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #0e0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            width: 420px;
            height: 760px;
            background: #f8f6f1;
            border-radius: 24px;
            box-shadow:
                0 30px 80px rgba(0,0,0,0.5),
                0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── HEADER ── */
        .header {
            position: relative;
            min-height: 160px;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Animated gradient background */
        .header-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a1a2e 100%);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Geometric pattern overlay */
        .header-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.06;
            background-image:
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 20px,
                    rgba(201,168,76,1) 20px,
                    rgba(201,168,76,1) 21px
                ),
                repeating-linear-gradient(
                    -45deg,
                    transparent,
                    transparent 20px,
                    rgba(201,168,76,1) 20px,
                    rgba(201,168,76,1) 21px
                );
        }

        /* Gold shimmer line */
        .header-shimmer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a84c, transparent);
            animation: shimmer 3s ease infinite;
        }
        @keyframes shimmer {
            0%   { opacity: 0.4; }
            50%  { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .header-content {
            position: relative;
            z-index: 1;
            padding: 28px 24px 24px;
        }

        .concierge-label {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c9a84c;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .hotel-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-weight: 600;
            color: #f8f4ee;
            letter-spacing: 0.5px;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .online-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(76,175,80,0.15);
            border: 1px solid rgba(76,175,80,0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
            color: #81c784;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .online-dot {
            width: 6px;
            height: 6px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.8); }
        }

        .response-time {
            font-size: 10px;
            font-weight: 300;
            color: rgba(248,244,238,0.3);
            letter-spacing: 0.5px;
        }

        /* ── MESSAGES ── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 18px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: rgba(26,26,46,0.1); border-radius: 2px; }

        .message {
            max-width: 78%;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.6;
            animation: messageIn 0.3s ease both;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .agent {
            background: white;
            color: #1a1a2e;
            align-self: flex-start;
            border-radius: 4px 18px 18px 18px;
            box-shadow: 0 2px 12px rgba(26,26,46,0.08);
            font-weight: 300;
            position: relative;
        }

        /* Subtle gold left accent on agent messages */
        .agent::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: linear-gradient(to bottom, #c9a84c, transparent);
            border-radius: 2px;
        }

        .user {
            background: #1a1a2e;
            color: #f8f4ee;
            align-self: flex-end;
            border-radius: 18px 4px 18px 18px;
            font-weight: 400;
            box-shadow: 0 4px 16px rgba(26,26,46,0.25);
        }

        .agent h1, .agent h2, .agent h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-weight: 600;
            margin: 6px 0 4px;
            color: #1a1a2e;
        }
        .agent p { margin: 3px 0; }
        .agent ul, .agent ol { margin: 6px 0; padding-left: 18px; }
        .agent li { margin: 3px 0; }
        .agent strong { font-weight: 500; }

        /* Timestamp */
        .msg-time {
            font-size: 9px;
            font-weight: 300;
            color: rgba(26,26,46,0.25);
            margin-top: 4px;
            text-align: right;
        }
        .user + .msg-time, .agent + .msg-time { display: none; }

        /* ── TYPING ── */
        .typing-wrap {
            padding: 0 18px 4px;
            min-height: 36px;
            display: flex;
            align-items: center;
        }

        .typing-bubble {
            background: white;
            border-radius: 4px 18px 18px 18px;
            padding: 12px 16px;
            box-shadow: 0 2px 12px rgba(26,26,46,0.08);
            display: none;
            align-items: center;
            gap: 5px;
        }
        .typing-bubble.visible { display: flex; }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: #c9a84c;
            border-radius: 50%;
            animation: typingDot 1.4s ease infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30%            { transform: translateY(-6px); opacity: 1; }
        }

        /* ── QUICK REPLIES ── */
        .quick-replies {
            display: flex;
            gap: 8px;
            padding: 10px 18px 6px;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .quick-replies::-webkit-scrollbar { display: none; }

        .quick-reply {
            white-space: nowrap;
            background: white;
            border: 1px solid rgba(201,168,76,0.3);
            color: #1a1a2e;
            padding: 7px 16px;
            border-radius: 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 4px rgba(26,26,46,0.06);
            animation: pillIn 0.4s ease both;
        }

        .quick-reply:nth-child(1) { animation-delay: 0.05s; }
        .quick-reply:nth-child(2) { animation-delay: 0.10s; }
        .quick-reply:nth-child(3) { animation-delay: 0.15s; }
        .quick-reply:nth-child(4) { animation-delay: 0.20s; }
        .quick-reply:nth-child(5) { animation-delay: 0.25s; }

        @keyframes pillIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .quick-reply:hover {
            background: #1a1a2e;
            color: #c9a84c;
            border-color: #1a1a2e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26,26,46,0.15);
        }
        .quick-reply:active { transform: translateY(0); }

        /* ── INPUT ── */
        .input-area {
            padding: 12px 16px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f8f6f1;
            border-top: 1px solid rgba(26,26,46,0.06);
            flex-shrink: 0;
        }

        .input-wrap {
            flex: 1;
            background: white;
            border: 1.5px solid rgba(26,26,46,0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrap:focus-within {
            border-color: rgba(201,168,76,0.5);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 300;
            color: #1a1a2e;
            background: transparent;
            padding: 12px 0;
        }
        input::placeholder { color: rgba(26,26,46,0.25); }

        .send-btn {
            width: 46px;
            height: 46px;
            background: #1a1a2e;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(26,26,46,0.25);
        }
        .send-btn:hover {
            background: #c9a84c;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(201,168,76,0.35);
        }
        .send-btn:active { transform: scale(0.97); }

        .send-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .send-btn:hover .send-icon { stroke: #1a1a2e; }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            body { background: #f8f6f1; align-items: flex-start; }
            .chat-container {
                width: 100%;
                height: 100vh;
                height: 100dvh;
                border-radius: 0;
                box-shadow: none;
            }
            input { font-size: 16px; }
            .header { min-height: 140px; }
        }
    </style>
</head>
<body>
    <div class="chat-container">

        <div class="header">
            <div class="header-bg"></div>
            <div class="header-pattern"></div>
            <div class="header-shimmer"></div>
            <div class="header-content">
                <div class="concierge-label">Personal Concierge</div>
                <div class="hotel-title hotel-name">Loading...</div>
                <div class="status-row">
                    <div class="online-pill">
                        <div class="online-dot"></div>
                        Available 24/7
                    </div>
                    <span class="response-time">Replies instantly</span>
                </div>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="typing-wrap">
            <div class="typing-bubble" id="typingBubble">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply" onclick="sendQuick('WiFi password please')">WiFi Password</button>
            <button class="quick-reply" onclick="sendQuick('What time is breakfast?')">Breakfast times</button>
            <button class="quick-reply" onclick="sendQuick('I\'d like to order room service')">Room service</button>
            <button class="quick-reply" onclick="sendQuick('What are the pool hours?')">Pool hours</button>
            <button class="quick-reply" onclick="sendQuick('Can you make up my room please?')">Housekeeping</button>
        </div>

        <div class="input-area">
            <div class="input-wrap">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Ask anything..."
                    onkeypress="handleKey(event)"
                />
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <svg class="send-icon" viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const slug = window.location.pathname.split('/')[2] || '';
        let conversationHistory = [];

        async function loadConfig() {
            const url = slug ? `/get-hotel/${slug}` : '/hotel-config';
            const r = await fetch(url);
            const config = await r.json();
            document.querySelectorAll('.hotel-name').forEach(el => el.textContent = config.name);
            document.title = config.name + ' — Concierge';
            return config;
        }

        function getTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        window.onload = async function() {
            const config = await loadConfig();
            addMessage(`Welcome to ${config.name}. 🌟\n\nI'm your personal concierge — here to help with anything you need, any time of day. How can I make your stay more comfortable?`, 'agent');
        }

        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
        function sendQuick(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            // Hide quick replies after first message
            document.getElementById('quickReplies').style.opacity = '0.4';

            addMessage(message, 'user');
            input.value = '';

            document.getElementById('typingBubble').classList.add('visible');
            scrollToBottom();

            try {
                const r = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, slug, history: conversationHistory })
            });
                const data = await r.json();
                conversationHistory = data.history;
                document.getElementById('typingBubble').classList.remove('visible');
                addMessage(data.response, 'agent');
            } catch(e) {
                document.getElementById('typingBubble').classList.remove('visible');
                addMessage('I apologise — something went wrong. Please try again.', 'agent');
            }
        }

        function addMessage(text, sender) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            if (sender === 'agent') {
                div.innerHTML = marked.parse(text);
            } else {
                div.textContent = text;
            }
            messages.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const messages = document.getElementById('messages');
            setTimeout(() => messages.scrollTop = messages.scrollHeight, 50);
        }
    </script>
</body>
</html>
