<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard | {HOTEL_NAME}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
        }
        .header {
            background: #1a1a2e;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h2 { font-size: 16px; }
        .header p { font-size: 11px; opacity: 0.7; }
        .live-dot {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .body { padding: 15px; max-width: 700px; margin: 0 auto; }
        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: #666;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .request-card {
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 5px solid;
        }
        .request-card.new {
            background: white;
            border-color: #ff4444;
        }
        .request-card.inprogress {
            background: white;
            border-color: #FFA500;
        }
        .request-card.done {
            background: #f9f9f9;
            border-color: #ccc;
            opacity: 0.7;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .department-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-housekeeping { background: #ffe0e0; color: #cc0000; }
        .badge-roomservice { background: #fff3e0; color: #e65c00; }
        .badge-maintenance { background: #e3f2fd; color: #0066cc; }
        .badge-concierge { background: #e8f5e9; color: #2e7d32; }
        .badge-general { background: #f3f3f3; color: #666; }
        .room-number {
            font-size: 13px;
            font-weight: bold;
            color: #1a1a2e;
        }
        .request-details {
            font-size: 13px;
            color: #444;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .request-time {
            font-size: 11px;
            color: #999;
        }
        .claimed-by {
            font-size: 11px;
            color: #FFA500;
            font-style: italic;
        }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-claim {
            background: #1a1a2e;
            color: white;
        }
        .btn-done {
            background: #4CAF50;
            color: white;
        }
        .btn-undo {
            background: #f0f0f0;
            color: #666;
        }
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 14px;
            background: white;
            border-radius: 12px;
        }
        .login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .login-box h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 6px; }
        .login-box p { font-size: 12px; color: #999; margin-bottom: 20px; }
        .name-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
            text-align: center;
        }
        .name-input:focus { border-color: #1a1a2e; }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
        }
        .login-error {
            color: red;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
        @media (max-width: 600px) {
            .body { padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <div style="font-size: 36px; margin-bottom: 12px;">👥</div>
            <h2>Staff Dashboard | {HOTEL_NAME}</h2>
            </h2>
            <p><span class="hotel-name">Loading...</span></p>
            <input
                type="text"
                class="name-input"
                id="staffName"
                placeholder="Your name"
                onkeypress="if(event.key==='Enter') checkPassword()"
            />
            <input
                type="password"
                class="name-input"
                id="staffPassword"
                placeholder="Password"
                onkeypress="if(event.key==='Enter') checkPassword()"
            />
            <button class="login-btn" onclick="checkPassword()">Enter Dashboard</button>
            <p class="login-error" id="loginError">Incorrect password. Try again.</p>
        </div>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="header">
            <div>
                <h2>🏨 Staff Dashboard</h2>
                <p id="staffGreeting"><span class="hotel-name">Loading...</span></p>
            </div>
            <div class="live-dot">
                <div class="dot"></div>
                Live
            </div>
        </div>

        <div class="body">
            <p class="section-title">🔴 New Requests</p>
            <div id="newRequests"></div>

            <p class="section-title">🟡 In Progress</p>
            <div id="inProgressRequests"></div>

            <p class="section-title">✅ Completed Today</p>
            <div id="doneRequests"></div>
        </div>
    </div>

    <script>
        let staffName = "";

        // Load hotel name on page load
        async function loadHotelName() {
            const response = await fetch('/hotel-config');
            const config = await response.json();
            document.querySelectorAll('.hotel-name').forEach(el => {
                el.textContent = config.name;
            });
        }

        loadHotelName();

        async function checkPassword() {
            const response = await fetch('/hotel-config');
            const config = await response.json();

            const name = document.getElementById('staffName').value.trim();
            const password = document.getElementById('staffPassword').value;

            if (!name) {
                document.getElementById('loginError').textContent = 'Please enter your name.';
                document.getElementById('loginError').style.display = 'block';
                return;
            }

            if (password === config.staff_password) {
                staffName = name;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('staffGreeting').textContent = `Welcome, ${staffName} 👋`;
                loadRequests();
                setInterval(loadRequests, 10000);
            } else {
                document.getElementById('loginError').textContent = 'Incorrect password. Try again.';
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function departmentBadge(dept) {
            const labels = {
                housekeeping: '🔴 Housekeeping',
                roomservice: '🟠 Room Service',
                maintenance: '🔵 Maintenance',
                concierge: '🟢 Concierge',
                general: '⚪ General'
            };
            return `<span class="department-badge badge-${dept}">${labels[dept] || dept}</span>`;
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            return dateStr.split(' ')[1] || dateStr;
        }

        function renderCard(req) {
            const isNew = req.status === 'new';
            const isProgress = req.status === 'inprogress';
            const isDone = req.status === 'done';

            let buttons = '';
            if (isNew) {
                buttons = `
                    <div class="btn-row">
                        <button class="btn btn-claim" onclick="claimRequest(${req.id})">I'm On It 👋</button>
                        <button class="btn btn-done" onclick="completeRequest(${req.id})">Done ✅</button>
                    </div>`;
            } else if (isProgress) {
                buttons = `
                    <div class="btn-row">
                        <button class="btn btn-done" onclick="completeRequest(${req.id})">Done ✅</button>
                        <button class="btn btn-undo" onclick="unclaim(${req.id})">Undo</button>
                    </div>`;
            } else if (isDone) {
                buttons = `
                    <div class="btn-row">
                        <button class="btn btn-undo" onclick="undoDone(${req.id})">Undo</button>
                    </div>`;
            }

            return `
                <div class="request-card ${isProgress ? 'inprogress' : isDone ? 'done' : 'new'}" id="card-${req.id}">
                    <div class="card-top">
                        ${departmentBadge(req.department)}
                        <span class="room-number">Room ${req.room}</span>
                    </div>
                    <div class="request-details">${req.details}</div>
                    <div class="card-bottom">
                        <div>
                            <div class="request-time">${formatTime(req.date)}</div>
                            ${req.claimed_by ? `<div class="claimed-by">👋 ${req.claimed_by}</div>` : ''}
                        </div>
                        ${buttons}
                    </div>
                </div>`;
        }

        async function loadRequests() {
            const response = await fetch('/get-requests');
            const requests = await response.json();

            const today = new Date().toISOString().split('T')[0];

            const newReqs = requests.filter(r => r.status === 'new');
            const inProgress = requests.filter(r => r.status === 'inprogress');
            const done = requests.filter(r => r.status === 'done' && r.date && r.date.startsWith(today));

            document.getElementById('newRequests').innerHTML =
                newReqs.length ? newReqs.map(renderCard).join('') :
                '<div class="empty-state">No new requests 🙌</div>';

            document.getElementById('inProgressRequests').innerHTML =
                inProgress.length ? inProgress.map(renderCard).join('') :
                '<div class="empty-state">Nothing in progress</div>';

            document.getElementById('doneRequests').innerHTML =
                done.length ? done.map(renderCard).join('') :
                '<div class="empty-state">No completed requests yet today</div>';
        }

        async function claimRequest(id) {
            await fetch('/update-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status: 'inprogress', claimed_by: staffName })
            });
            loadRequests();
        }

        async function completeRequest(id) {
            await fetch('/update-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status: 'done', claimed_by: staffName })
            });
            loadRequests();
        }

        async function unclaim(id) {
            await fetch('/update-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status: 'new', claimed_by: '' })
            });
            loadRequests();
        }

        async function undoDone(id) {
            await fetch('/update-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status: 'inprogress', claimed_by: staffName })
            });
            loadRequests();
        }
    </script>
</body>
</html>
